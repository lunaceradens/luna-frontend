                                                <th style={{padding:"10px", textAlign:"right"}}>BONUSI I PLATE<br/>(KLIKNI)</th>
                                                <th style={{padding:"10px", textAlign:"right", color: C.accent}}>NETO EUR<br/>(vs {filterYear - 1})</th>
                                                <th style={{padding:"10px", textAlign:"right", color: C.modra}}>NETO RSD<br/>(vs {filterYear - 1})</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {sortiraniMeseci(filterYear).map(i => {
                                                const m = MONTHS_SHORT[i];
                                                const curr = getStats(filterYear, i);
                                                const prev = getStats(filterYear - 1, i); 
                                                
                                                return (
                                                    <tr key={i} style={{borderBottom: `1px solid ${C.border}`}}>
                                                        <td 
                                                            style={{padding: "12px 10px", color: C.accent, fontWeight: "bold", cursor: "pointer", textDecoration: "underline", textDecorationStyle: "dotted", textUnderlineOffset: "3px"}} 
                                                            onClick={() => setPresekModal({otvoren: true, mesec: i, naziv: m, brojGodina: 11})}
                                                            title="Klikni za uporedni presek kroz godine"
                                                        >{m} 🔍</td>
                                                        <td style={{padding: "12px 10px", textAlign:"right"}}>
                                                            <div style={{color: C.text}}>{fmt(curr.promEUR)} €</div>
                                                            <div style={{color: C.modra, fontSize: "10px"}}>{fmt(curr.promRSD)} din</div>
                                                        </td>
                                                        <td style={{padding: "12px 10px", textAlign:"right", color: C.muted}}>
                                                            <div>{fmt(curr.kasaEUR)} €</div>
                                                            <div style={{fontSize: "10px"}}>{fmt(curr.kasaRSD)} din</div>
                                                        </td>
                                                        <td style={{padding: "12px 10px", textAlign:"right", color: C.accent}}>
                                                            <div>{fmt(curr.kesEUR)} €</div>
                                                            <div style={{color: C.accent, fontSize: "10px"}}>{fmt(curr.kesRSD)} din</div>
                                                        </td>
                                                        <td className="klikabilna-celija" style={{padding: "12px 10px", textAlign:"right", color: C.text}} onClick={() => setDetaljiModal({ tip: 'trosak', mesec: i, nazivMeseca: m })}>
                                                            <div>{fmt(curr.trosE)} € <span className="ikonica-lupa">🔍</span></div>
                                                            <div style={{fontSize: "10px", color: C.modra}}>{fmt(curr.trosRSD)} din</div>
                                                        </td>
                                                        <td className="klikabilna-celija" style={{padding: "12px 10px", textAlign:"right", color: C.text}} onClick={() => setDetaljiModal({ tip: 'bonus', mesec: i, nazivMeseca: m })}>
                                                            <div>{fmt(curr.bonE)} € <span className="ikonica-lupa">🔍</span></div>
                                                            <div style={{fontSize: "10px", color: C.modra}}>{fmt(curr.bonRSD)} din</div>
                                                        </td>
                                                        <td style={{padding: "12px 10px", textAlign:"right", color: C.accent, fontWeight: "bold", fontSize: "14px"}}>
                                                            <div>{fmt(curr.kristalE)} €</div>
                                                            <div style={{fontSize: "9px", color: C.muted, fontWeight: "normal"}}>prošla: {fmt(prev.kristalE)} €</div>
                                                        </td>
                                                        <td style={{padding: "12px 10px", textAlign:"right", color: C.modra, fontWeight: "bold", fontSize: "14px"}}>
                                                            <div>{fmt(curr.kristalRSD)} din</div>
                                                            <div style={{fontSize: "9px", color: C.muted, fontWeight: "normal"}}>prošla: {fmt(prev.kristalRSD)} din</div>
                                                        </td>
                                                    </tr>
                                                )
                                            })}
                                            <tr style={{background: "rgba(255,255,255,0.05)", borderTop: `2px solid ${C.accent}`}}>
                                                <td style={{padding: "15px 10px", color: C.accent, fontWeight: "bold"}}>UKUPNO<br/>ZA GODINU</td>
                                                <td style={{padding: "15px 10px", textAlign:"right", fontWeight: "bold"}}>
                                                    <div style={{color: C.text}}>{fmt(sumPromE)} €</div>
                                                    <div style={{color: C.modra, fontSize: "10px"}}>{fmt(sumPromR)} din</div>
                                                </td>
                                                <td style={{padding: "15px 10px", textAlign:"right", color: C.muted, fontWeight: "bold"}}>
                                                    <div>{fmt(sumKasaE)} €</div>
                                                    <div style={{fontSize: "10px"}}>{fmt(sumKasaR)} din</div>
                                                </td>
                                                <td style={{padding: "15px 10px", textAlign:"right", color: C.accent, fontWeight: "bold"}}>
                                                    <div>{fmt(sumKesE)} €</div>
                                                    <div style={{color: C.accent, fontSize: "10px"}}>{fmt(sumKesR)} din</div>
                                                </td>
                                                <td style={{padding: "15px 10px", textAlign:"right", color: C.text, fontWeight: "bold"}}>
                                                    <div>{fmt(sumTrosE)} €</div>
                                                    <div style={{fontSize: "10px", color: C.modra}}>{fmt(sumTrosR)} din</div>
                                                </td>
                                                <td style={{padding: "15px 10px", textAlign:"right", color: C.text, fontWeight: "bold"}}>
                                                    <div>{fmt(sumBonE)} €</div>
                                                    <div style={{fontSize: "10px", color: C.modra}}>{fmt(sumBonR)} din</div>
                                                </td>
                                                <td style={{padding: "15px 10px", textAlign:"right", color: C.accent, fontWeight: "bold", fontSize: "15px"}}>
                                                    <div>{fmt(sumNetoE)} €</div>
                                                    <div style={{fontSize: "10px", color: C.muted, fontWeight: "normal"}}>prošla: {fmt(sumPrevNetoE)} €</div>
                                                </td>
                                                <td style={{padding: "15px 10px", textAlign:"right", color: C.modra, fontWeight: "bold", fontSize: "15px"}}>
                                                    <div>{fmt(sumNetoR)} din</div>
                                                    <div style={{fontSize: "10px", color: C.muted, fontWeight: "normal"}}>prošla: {fmt(sumPrevNetoR)} din</div>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                    )}
                                </div>

                                <div style={{display: "grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr", gap: "15px", marginBottom: "25px"}}>
                                    <div style={s.card}>
                                        <h4 style={{color: C.muted, margin: "0 0 15px 0", fontSize: "13px", textAlign: "center"}}>Finansijski Trend (EUR)</h4>
                                        <MultiBarChart netoColor={C.accent} data={MONTHS_SHORT.map((m, i) => { const curr = getStats(filterYear, i); return { label: m, bars: [{val: curr.promEUR, color: "#ffffff", tooltip: "Bruto Promet"}, {val: curr.kasaEUR, color: "#b8b8cc", tooltip: "Fiskalna Kasa"}, {val: curr.trosE + curr.bonE, color: C.red, tooltip: "Troškovi + Bonusi"}, {val: curr.kristalE, color: C.accent, tooltip: "Kristalni Neto"}] } })} />
                                    </div>
                                    <div style={s.card}>
                                        <h4 style={{color: C.muted, margin: "0 0 15px 0", fontSize: "13px", textAlign: "center"}}>Finansijski Trend (RSD)</h4>
                                        <MultiBarChart netoColor={C.modra} data={MONTHS_SHORT.map((m, i) => { const curr = getStats(filterYear, i); return { label: m, bars: [{val: curr.promRSD, color: "#ffffff", tooltip: "Bruto Promet"}, {val: curr.kasaRSD, color: "#b8b8cc", tooltip: "Fiskalna Kasa"}, {val: curr.trosRSD + curr.bonRSD, color: C.red, tooltip: "Troškovi + Bonusi"}, {val: curr.kristalRSD, color: C.modra, tooltip: "Kristalni Neto"}] } })} />
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {detaljiModal.tip && (
                        <div style={s.modalBg}>
                            <div style={{...s.card, width: '90%', maxWidth: '850px', maxHeight: '85vh', overflowY: 'auto', position: 'relative', background: '#110c24', border: `1px solid ${C.main}`}}>
                                <button style={{position:'absolute', top: 15, right: 20, background: 'transparent', border: 'none', color: C.red, cursor: 'pointer', fontSize: '24px'}} onClick={() => setDetaljiModal({tip: null, mesec: null, nazivMeseca: ""})}>×</button>
                                {detaljiModal.tip === 'trosak' && (
                                    <div>
                                        <h2 style={{color: C.text, borderBottom: `1px solid ${C.border}`, paddingBottom: '10px'}}>Detalji troškova: {detaljiModal.nazivMeseca} {filterYear}.</h2>
                                        <table style={{width: "100%", borderCollapse: "collapse", fontSize: "13px", marginTop: "15px"}}>
                                            <thead>
                                                <tr style={{color: C.muted, textTransform: "uppercase", fontSize: "11px", borderBottom: `1px solid ${C.border}`}}>
                                                    <th style={{padding:"10px", textAlign:"left"}}>Datum</th><th style={{padding:"10px", textAlign:"left"}}>Naziv Troška</th><th style={{padding:"10px", textAlign:"right"}}>Iznos</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {troskovi.filter(t => { const d = new Date(t.datum); return !isNaN(d.getFullYear()) && d.getFullYear() === filterYear && d.getMonth() === detaljiModal.mesec; }).sort((a,b) => new Date(b.datum) - new Date(a.datum)).map((t, i) => (
                                                    <tr key={i} style={{borderBottom: `1px solid ${C.border}`}}>
                                                        <td style={{padding: "10px", color: C.muted}}>{t.datum}</td><td style={{padding: "10px", color: C.text}}>{t.naziv}</td><td style={{padding: "10px", textAlign: "right", color: t.valuta === 'EUR' ? "#c8963e" : C.modra, fontWeight: "bold"}}>{fmt(t.iznos, t.valuta)}</td>
                                                    </tr>
                                                ))}
                                                {troskovi.filter(t => new Date(t.datum).getFullYear() === filterYear && new Date(t.datum).getMonth() === detaljiModal.mesec).length === 0 && ( <tr><td colSpan="3" style={{padding: "20px", textAlign: "center", color: C.muted}}>Nema unetih troškova za ovaj mesec.</td></tr> )}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                                {detaljiModal.tip === 'bonus' && (
                                    <div>
                                        <h2 style={{color: C.text, borderBottom: `1px solid ${C.border}`, paddingBottom: '10px'}}>Plate i Bonusi (Izveštaj): {detaljiModal.nazivMeseca} {filterYear}.</h2>
                                        <table style={{width: "100%", borderCollapse: "collapse", fontSize: "12px", marginTop: "15px"}}>
                                            <thead>
                                                <tr style={{color: C.muted, textTransform: "uppercase", fontSize: "10px", borderBottom: `1px solid ${C.border}`}}>
                                                    <th style={{padding:"10px", textAlign:"left"}}>Zaposleni</th><th style={{padding:"10px", textAlign:"right", color: C.text}}>Ovaj mesec ({detaljiModal.nazivMeseca})</th><th style={{padding:"10px", textAlign:"right", color: C.accent}}>Ukupno ({filterYear})</th><th style={{padding:"10px", textAlign:"right", color: C.muted}}>Ukupno ({filterYear - 1})</th><th style={{padding:"10px", textAlign:"right"}}>Godišnji Trend</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {zaposleni.map((zap, i) => {
                                                    const bArrMesec = bonusi[`${filterYear}-${detaljiModal.mesec}`]; const mesecEUR = uMesecuZap(bArrMesec, zap.id, 'eur'); const mesecRSD = uMesecuZap(bArrMesec, zap.id, 'rsd');
                                                    const godEUR = calcGodisnjiBonusZap(filterYear, zap.id, 'eur'); const godRSD = calcGodisnjiBonusZap(filterYear, zap.id, 'rsd'); const proslaEUR = calcGodisnjiBonusZap(filterYear - 1, zap.id, 'eur'); const proslaRSD = calcGodisnjiBonusZap(filterYear - 1, zap.id, 'rsd');
                                                    const trendEUR = godEUR - proslaEUR; const trendKarakterEUR = trendEUR > 0 ? "▲" : (trendEUR < 0 ? "▼" : "—"); const trendBojaEUR = trendEUR > 0 ? "#4a9e6e" : (trendEUR < 0 ? C.red : C.muted);
                                                    return (
                                                        <tr key={zap.id} style={{borderBottom: `1px solid ${C.border}`}}>
                                                            <td style={{padding: "12px 10px", color: C.text, fontWeight: "bold"}}>{zap.ime}</td>
                                                            <td style={{padding: "12px 10px", textAlign:"right"}}>{mesecEUR > 0 && <div style={{color: C.text}}>{fmt(mesecEUR)} €</div>}{mesecRSD > 0 && <div style={{color: C.modra}}>{fmt(mesecRSD)} din</div>}{mesecEUR === 0 && mesecRSD === 0 && <div style={{color: C.muted}}>—</div>}</td>
                                                            <td style={{padding: "12px 10px", textAlign:"right", background: "rgba(0,200,245,0.05)"}}>{godEUR > 0 && <div style={{color: C.accent, fontWeight: "bold"}}>{fmt(godEUR)} €</div>}{godRSD > 0 && <div style={{color: C.modra}}>{fmt(godRSD)} din</div>}{godEUR === 0 && godRSD === 0 && <div style={{color: C.muted}}>—</div>}</td>
                                                            <td style={{padding: "12px 10px", textAlign:"right"}}>{proslaEUR > 0 && <div style={{color: C.muted}}>{fmt(proslaEUR)} €</div>}{proslaRSD > 0 && <div style={{color: C.muted}}>{fmt(proslaRSD)} din</div>}{proslaEUR === 0 && proslaRSD === 0 && <div style={{color: C.muted}}>—</div>}</td>
                                                            <td style={{padding: "12px 10px", textAlign:"right"}}><div style={{color: trendBojaEUR, fontSize: "11px"}}>{trendKarakterEUR} {Math.abs(trendEUR)} €</div></td>
                                                        </tr>
                                                    )
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                    {/* Print Modal - radi i na mobilnom i na desktopu */}
                    {printModalData && (
                        <div style={{position: 'fixed', top:0, left:0, right:0, bottom:0, background: 'rgba(0,0,0,0.85)', zIndex: 2000, display: 'flex', flexDirection: 'column', backdropFilter: 'blur(5px)'}}>
                            {/* Header sa dugmadima */}
                            <div style={{display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 20px", background: "#1a1a2e", borderBottom: `1px solid ${C.border}`, position: "sticky", top: 0, zIndex: 10, gap: "8px", flexWrap: "wrap"}}>
                                <button style={{...s.btn(false), padding: "10px 14px", fontSize: "13px"}} onClick={zatvoriPrintModal} disabled={pdfUToku}>✕ Zatvori</button>
                                <div style={{display: "flex", gap: "6px", flexWrap: "wrap"}}>
                                    <button style={{...s.btn(true, C.teal), padding: "10px 14px", fontSize: "13px", fontWeight: "bold", opacity: pdfUToku ? 0.5 : 1}} onClick={posaljiPDF} disabled={pdfUToku} title="Pošalji preko WhatsApp/Viber/Email">
                                        {pdfUToku ? "⏳ Generišem..." : "📤 Pošalji"}
                                    </button>
                                    <button style={{...s.btn(true, C.main), padding: "10px 14px", fontSize: "13px", fontWeight: "bold", opacity: pdfUToku ? 0.5 : 1}} onClick={sacuvajPDFLokalno} disabled={pdfUToku}>
                                        {pdfUToku ? "⏳ Generišem..." : "💾 Sačuvaj PDF"}
                                    </button>
                                    <button style={{...s.btn(true, C.accent), padding: "10px 14px", fontSize: "13px", fontWeight: "bold"}} onClick={stampajIzModala} disabled={pdfUToku}>🖨️ Štampaj</button>
                                </div>
                            </div>
                            {/* Sadržaj dokumenta - scrollable, renderovan kroz dangerouslySetInnerHTML */}
                            <div style={{flex: 1, overflow: "auto", background: "#ffffff", padding: "0"}}>
                                <div 
                                    dangerouslySetInnerHTML={{ __html: printModalData.html.replace(/<!DOCTYPE[^>]*>|<html[^>]*>|<\/html>|<head>[\s\S]*?<\/head>|<body[^>]*>|<\/body>/gi, '') }}
                                    style={{minHeight: "100%", color: "#1a1a2e", padding: "20px"}}
                                />
                            </div>
                            {/* Footer info */}
                            <div style={{padding: "10px 16px", background: "#1a1a2e", borderTop: `1px solid ${C.border}`, color: C.muted, fontSize: "11px", textAlign: "center"}}>
                                💡 <strong>📤 Pošalji</strong> = WhatsApp/Viber/Email | <strong>💾 PDF</strong> = download | <strong>🖨️ Štampaj</strong> = pisač
                            </div>
                        </div>
                    )}
                    {/* UPOREDNI PRESEK MODAL - klik na ime meseca */}
                    {presekModal.otvoren && (() => {
                        const tekucaGodina = new Date().getFullYear();
                        const godine = [];
                        for (let g = tekucaGodina; g >= tekucaGodina - (presekModal.brojGodina - 1); g--) godine.push(g);
                        const podaci = godine.map(g => ({godina: g, stats: getStats(g, presekModal.mesec)}));
                        
                        return (
                        <div style={{position: 'fixed', top:0, left:0, right:0, bottom:0, background: 'rgba(0,0,0,0.85)', zIndex: 2000, display: 'flex', flexDirection: 'column', backdropFilter: 'blur(5px)', overflow: 'auto'}}>
                            {/* Header */}
                            <div style={{display: "flex", justifyContent: "space-between", alignItems: "center", padding: "14px 20px", background: "#1a1a2e", borderBottom: `2px solid ${C.accent}`, position: "sticky", top: 0, zIndex: 10, gap: "10px", flexWrap: "wrap"}}>
                                <div>
                                    <div style={{fontSize: "11px", color: C.muted, textTransform: "uppercase", letterSpacing: "1px"}}>Uporedni presek</div>
                                    <div style={{fontSize: "20px", fontWeight: "bold", color: C.accent}}>{presekModal.naziv} kroz {presekModal.brojGodina} godina</div>
                                </div>
                                <div style={{display: "flex", gap: "8px", alignItems: "center"}}>
                                    <span style={{fontSize: "11px", color: C.muted}}>Period:</span>
                                    <select 
                                        style={{...s.inp, width: "auto", padding: "8px 10px", fontSize: "13px"}}
                                        value={presekModal.brojGodina}
                                        onChange={(e) => setPresekModal({...presekModal, brojGodina: parseInt(e.target.value)})}
                                    >
                                        <option value={5}>5 godina</option>
                                        <option value={11}>11 godina</option>
                                        <option value={20}>20 godina</option>
                                    </select>
                                    <button style={{...s.btn(false), padding: "10px 16px", fontSize: "14px"}} onClick={() => setPresekModal({otvoren: false, mesec: 0, naziv: "", brojGodina: 11})}>✕ Zatvori</button>
                                </div>
                            </div>
                            
                            {/* Sadržaj - scrollable */}
                            <div style={{flex: 1, overflow: "auto", padding: "20px"}}>
                                {/* TABELA */}
                                <div style={{...s.card, marginBottom: "20px", overflowX: "auto"}}>
                                    <h3 style={{color: C.text, marginTop: 0, fontSize: "15px"}}>📊 Tabela: {presekModal.naziv} kroz {godine.length} godina</h3>
                                    {isMobile ? (
                                        // Mobilni: kartice za godine
                                        <div>
                                            {podaci.map(p => (
                                                <div key={p.godina} className="mobile-card">
                                                    <div style={{color: C.accent, fontWeight: "bold", fontSize: "16px", marginBottom: "10px", paddingBottom: "6px", borderBottom: `1px solid ${C.border}`}}>{presekModal.naziv} {p.godina}</div>
                                                    <div className="mobile-card-row">
                                                        <span className="mobile-card-label">Bruto Promet:</span>
                                                        <span className="mobile-card-value">{fmt(p.stats.promEUR)} € <span style={{color: C.modra, fontSize: "11px"}}>/ {fmt(p.stats.promRSD)} din</span></span>
                                                    </div>
                                                    <div className="mobile-card-row">
                                                        <span className="mobile-card-label">Fiskalna Kasa:</span>
                                                        <span className="mobile-card-value" style={{color: C.muted}}>{fmt(p.stats.kasaEUR)} € / {fmt(p.stats.kasaRSD)} din</span>
                                                    </div>
                                                    <div className="mobile-card-row">
                                                        <span className="mobile-card-label" style={{color: C.accent}}>Keš Majstora:</span>
                                                        <span className="mobile-card-value" style={{color: C.accent}}>{fmt(p.stats.kesEUR)} € / {fmt(p.stats.kesRSD)} din</span>
                                                    </div>
                                                    <div className="mobile-card-row">
                                                        <span className="mobile-card-label">Troškovi:</span>
                                                        <span className="mobile-card-value">{fmt(p.stats.trosE)} € / {fmt(p.stats.trosRSD)} din</span>
                                                    </div>
                                                    <div className="mobile-card-row">
                                                        <span className="mobile-card-label">Bonusi:</span>
                                                        <span className="mobile-card-value">{fmt(p.stats.bonE)} € / {fmt(p.stats.bonRSD)} din</span>
                                                    </div>
                                                    <div className="mobile-card-row" style={{paddingTop: "10px", marginTop: "8px", borderTop: `1px solid ${C.border}`}}>
                                                        <span className="mobile-card-label" style={{color: C.accent, fontWeight: "bold"}}>NETO:</span>
                                                        <span style={{color: C.accent, fontWeight: "bold"}}>{fmt(p.stats.kristalE)} € <span style={{color: C.modra, fontSize: "11px"}}>/ {fmt(p.stats.kristalRSD)} din</span></span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                            <thead>
                                                <tr style={{color: C.muted, textTransform: "uppercase", borderBottom: `1px solid ${C.border}`, fontSize: "10px"}}>

                                                    <th style={{padding:"10px", textAlign:"right"}}>FISKALNA KASA<br/>(EUR/RSD)</th>

                                                    <th style={{padding:"10px", textAlign:"right"}}>TROŠKOVI<br/>(EUR/RSD)</th>
                                                    <th style={{padding:"10px", textAlign:"right"}}>BONUSI<br/>(EUR/RSD)</th>
                                                    <th style={{padding:"10px", textAlign:"right", color: C.accent}}>NETO EUR</th>
                                                    <th style={{padding:"10px", textAlign:"right", color: C.modra}}>NETO RSD</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {podaci.map((p, idx) => (
                                                    <tr key={p.godina} style={{borderBottom: `1px solid ${C.border}`, background: idx === 0 ? "rgba(0, 200, 245, 0.05)" : "transparent"}}>
                                                        <td style={{padding: "12px 10px", color: idx === 0 ? C.accent : C.text, fontWeight: "bold", fontSize: "14px"}}>{p.godina}</td>
                                                        <td style={{padding: "12px 10px", textAlign:"right"}}>
                                                            <div style={{color: C.text}}>{fmt(p.stats.promEUR)} €</div>
                                                            <div style={{color: C.modra, fontSize: "10px"}}>{fmt(p.stats.promRSD)} din</div>
                                                        </td>
                                                        <td style={{padding: "12px 10px", textAlign:"right", color: C.muted}}>
                                                            <div>{fmt(p.stats.kasaEUR)} €</div>
                                                            <div style={{fontSize: "10px"}}>{fmt(p.stats.kasaRSD)} din</div>
                                                        </td>
                                                        <td style={{padding: "12px 10px", textAlign:"right", color: C.accent, fontWeight: "bold"}}>
                                                            <div>{fmt(p.stats.kesEUR)} €</div>
                                                            <div style={{fontSize: "10px", color: C.modra}}>{fmt(p.stats.kesRSD)} din</div>
                                                        </td>
                                                        <td style={{padding: "12px 10px", textAlign:"right"}}>
                                                            <div>{fmt(p.stats.trosE)} €</div>
                                                            <div style={{fontSize: "10px", color: C.muted}}>{fmt(p.stats.trosRSD)} din</div>
                                                        </td>
                                                        <td style={{padding: "12px 10px", textAlign:"right"}}>
                                                            <div>{fmt(p.stats.bonE)} €</div>
                                                            <div style={{fontSize: "10px", color: C.muted}}>{fmt(p.stats.bonRSD)} din</div>
                                                        </td>
                                                        <td style={{padding: "12px 10px", textAlign:"right", color: C.accent, fontWeight: "bold"}}>{fmt(p.stats.kristalE)} €</td>
                                                        <td style={{padding: "12px 10px", textAlign:"right", color: C.modra, fontWeight: "bold"}}>{fmt(p.stats.kristalRSD)} din</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    )}
                                </div>
                                
                                {/* GRAFICI - 3 odvojena */}
                                <div style={{display: "grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr 1fr", gap: "15px"}}>
                                    {/* Grafik 1: Bruto Promet EUR */}
                                    <div style={s.card}>
                                        <h4 style={{color: C.accent, margin: "0 0 12px 0", fontSize: "12px", textAlign: "center", textTransform: "uppercase", letterSpacing: "1px"}}>📊 Bruto Promet EUR</h4>
                                        <PresekChart 
                                            data={podaci.map(p => ({label: String(p.godina), val: p.stats.promEUR}))}
                                            color={C.accent}
                                            unit="€"
                                        />
                                    </div>
                                    {/* Grafik 2: Bruto Promet RSD */}
                                    <div style={s.card}>
                                        <h4 style={{color: C.modra, margin: "0 0 12px 0", fontSize: "12px", textAlign: "center", textTransform: "uppercase", letterSpacing: "1px"}}>📊 Bruto Promet RSD</h4>
                                        <PresekChart 
                                            data={podaci.map(p => ({label: String(p.godina), val: p.stats.promRSD}))}
                                            color={C.modra}
                                            unit="din"
                                        />
                                    </div>
                                    {/* Grafik 3: Bonusi (oba) */}
                                    <div style={s.card}>
                                        <h4 style={{color: C.main, margin: "0 0 12px 0", fontSize: "12px", textAlign: "center", textTransform: "uppercase", letterSpacing: "1px"}}>📊 Bonusi (EUR + RSD)</h4>
                                        <PresekChart 
                                            data={podaci.map(p => ({label: String(p.godina), val: p.stats.bonE + (p.stats.bonRSD / 117)}))}
                                            color={C.main}
                                            unit="€ ekv."
                                        />
                                        <div style={{fontSize: "9px", color: C.muted, textAlign: "center", marginTop: "5px", fontStyle: "italic"}}>RSD konvertovan u EUR po 117</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        );
                    })()}
                    {/* FAJLOVI MODAL - klik na 📎 dugme u listi */}
                    {fajloviModal && fajloviModal.nalog && (
                        <div style={{position: 'fixed', top:0, left:0, right:0, bottom:0, background: 'rgba(0,0,0,0.85)', zIndex: 2000, display: 'flex', flexDirection: 'column', backdropFilter: 'blur(5px)', overflow: 'auto'}}>
                            <div style={{display: "flex", justifyContent: "space-between", alignItems: "center", padding: "14px 20px", background: "#1a1a2e", borderBottom: `2px solid ${C.accent}`, position: "sticky", top: 0, zIndex: 10}}>
                                <div>
                                    <div style={{fontSize: "11px", color: C.muted, textTransform: "uppercase", letterSpacing: "1px"}}>Interni fajlovi</div>
                                    <div style={{fontSize: "16px", fontWeight: "bold", color: C.accent}}>{fajloviModal.nalog.broj} — {fajloviModal.nalog.kupac}</div>
                                </div>
                                <button style={{...s.btn(false), padding: "10px 16px", fontSize: "14px"}} onClick={() => setFajloviModal(null)}>✕ Zatvori</button>
                            </div>
                            <div style={{flex: 1, overflow: "auto", padding: "20px"}}>
                                <div style={{...s.card, marginBottom: "15px", padding: "12px", background: "rgba(255, 200, 0, 0.05)", borderLeft: `3px solid #ffc800`}}>
                                    <div style={{color: "#ffc800", fontSize: "12px", fontWeight: "bold"}}>⚠️ INTERNI FAJLOVI</div>
                                    <div style={{color: C.muted, fontSize: "11px", marginTop: "3px"}}>Ovi fajlovi su za internu upotrebu (skice, foto materijala, nacrti za majstore). NE idu kupcu!</div>
                                </div>
                                
                                {(fajloviModal.nalog.fajlovi || []).length === 0 ? (
                                    <div style={{...s.card, padding: "40px", textAlign: "center", color: C.muted, fontStyle: "italic"}}>Nema fajlova.</div>
                                ) : (
                                    <div style={{display: "grid", gridTemplateColumns: isMobile ? "1fr" : "repeat(auto-fit, minmax(280px, 1fr))", gap: "12px"}}>
                                        {fajloviModal.nalog.fajlovi.map((f, idx) => (
                                            <div key={idx} style={{...s.card, padding: "15px"}}>
                                                <div style={{display: "flex", alignItems: "center", gap: "12px", marginBottom: "12px"}}>
                                                    <div style={{fontSize: "32px"}}>{ikonaFajla(f.tip)}</div>
                                                    <div style={{flex: 1, minWidth: 0}}>
                                                        <div style={{color: C.text, fontSize: "13px", fontWeight: "600", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis"}}>{f.naziv}</div>
                                                        <div style={{color: C.muted, fontSize: "10px", marginTop: "2px"}}>{formatFajlVelicina(f.velicina)}</div>
                                                    </div>
                                                </div>
                                                {f.tip && f.tip.startsWith('image/') && (
                                                    <a href={f.url} target="_blank" rel="noopener noreferrer">
                                                        <img src={f.url} alt={f.naziv} style={{width: "100%", maxHeight: "200px", objectFit: "cover", borderRadius: "6px", marginBottom: "10px", cursor: "pointer"}} />
                                                    </a>
                                                )}
                                                <div style={{display: "flex", gap: "8px"}}>
                                                    <a href={f.url} target="_blank" rel="noopener noreferrer" style={{...s.btn(true, C.modra), flex: 1, padding: "8px", fontSize: "12px", textAlign: "center", textDecoration: "none"}}>👁️ Otvori</a>
                                                    <button style={{...s.btn(false), padding: "8px 12px", fontSize: "12px", color: C.red, border: `1px solid ${C.red}`}} onClick={() => obrisiFajlIzNaloga(fajloviModal.nalog.id, idx)}>❌</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                    {saved && <div style={{position: "fixed", bottom: "20px", right: "20px", background: saved.isError ? C.red : C.main, padding: "10px 20px", borderRadius: "8px", color: "white", zIndex: 1000, backdropFilter: C.glass, boxShadow: "0 4px 15px rgba(0,0,0,0.2)"}}>{saved.msg}</div>}
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
